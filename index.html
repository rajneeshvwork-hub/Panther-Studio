<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QuietCue — Present naturally. Stay on track.</title>
<meta name="description" content="A simple presentation recorder with private notes, camera and microphone." />
<style>
:root{
  --bg:#f4f2ed; --surface:rgba(255,255,255,.88); --surface-solid:#fff;
  --ink:#17171a; --muted:#77777f; --line:rgba(23,23,26,.09);
  --accent:#6257ff; --accent-soft:#eeecff; --danger:#e74b4b;
  --shadow:0 22px 70px rgba(35,31,54,.12); --shadow-soft:0 12px 32px rgba(35,31,54,.08);
  --radius:22px;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{background:radial-gradient(circle at 50% -20%,#fff 0,rgba(255,255,255,.66) 28%,transparent 58%),var(--bg)}
button,input,textarea,select{font:inherit} button{border:0;cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);backdrop-filter:blur(16px);background:rgba(244,242,237,.75);position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;font-weight:720;letter-spacing:-.03em;font-size:18px}.mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,#786dff,#4c42df);box-shadow:0 8px 22px rgba(98,87,255,.25);position:relative}.mark:after{content:"";position:absolute;width:9px;height:9px;border:3px solid white;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;left:8px;top:8px;transform:rotate(45deg)}
.device-row{display:flex;align-items:center;gap:8px}.chip{height:38px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.76);border:1px solid var(--line);color:#55555d;display:flex;align-items:center;gap:8px;font-weight:630;transition:.18s ease}.chip:hover{background:#fff;transform:translateY(-1px)}.chip.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-soft)}.dot{width:7px;height:7px;border-radius:50%;background:#b9b9c0}.chip.on .dot{background:#38ad70;box-shadow:0 0 0 4px rgba(56,173,112,.12)}
.main{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:34px 0 110px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:13px;color:var(--muted);font-weight:650;margin-bottom:7px}.title{font-size:28px;line-height:1.05;letter-spacing:-.045em;margin:0;font-weight:720}.deck-meta{color:var(--muted);font-size:13px;display:none}
.stage-shell{position:relative;background:#0f1014;border-radius:28px;padding:10px;box-shadow:0 32px 90px rgba(28,25,46,.18);border:1px solid rgba(255,255,255,.72)}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:19px;background:#0b0c10;display:grid;place-items:center}.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.pptx-stage{position:absolute;inset:0;display:none;overflow:hidden;background:#000;pointer-events:none}.pptx-stage.active{display:block}.empty{color:#b6b8c1;text-align:center;display:grid;place-items:center;gap:18px;padding:24px}.empty h2{color:#fff;margin:0;font-size:26px;letter-spacing:-.035em}.empty p{margin:0;max-width:440px;line-height:1.6;color:#8e9099}.primary{height:46px;padding:0 18px;border-radius:14px;background:var(--accent);color:white;font-weight:680;box-shadow:0 11px 25px rgba(98,87,255,.28);transition:.18s ease}.primary:hover{transform:translateY(-1px);filter:brightness(1.03)}.secondary{height:42px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:630}.ghost{height:38px;padding:0 11px;border-radius:11px;background:transparent;color:var(--muted);font-weight:630}.ghost:hover{background:rgba(23,23,26,.055);color:var(--ink)}
.camera-float{position:absolute;left:72%;top:67%;width:22%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;display:none;z-index:9;box-shadow:0 18px 48px rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.7);background:#1e2027;touch-action:none}.camera-float.visible{display:block}.camera-float video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.resize-handle{position:absolute;width:24px;height:24px;right:0;bottom:0;cursor:nwse-resize;z-index:3;touch-action:none}.resize-handle:after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-right:2px solid rgba(255,255,255,.9);border-bottom:2px solid rgba(255,255,255,.9)}
.notes{position:absolute;right:22px;top:22px;width:min(360px,34%);height:250px;background:rgba(252,251,248,.96);border:1px solid rgba(255,255,255,.8);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.23);z-index:12;display:none;overflow:hidden;touch-action:none}.notes.visible{display:flex;flex-direction:column}.notes-head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 15px;border-bottom:1px solid var(--line);cursor:grab;font-size:13px;font-weight:700}.notes-head:active{cursor:grabbing}.notes textarea{flex:1;border:0;resize:none;outline:none;background:transparent;padding:15px 16px 20px;color:#29292d;line-height:1.55;font-size:15px}.notes .resize-handle:after{border-color:#76767e}
.stage-tools{position:absolute;left:18px;bottom:18px;z-index:15;display:none;align-items:center;gap:8px}.stage-tools.visible{display:flex}.stage-tool{height:36px;padding:0 11px;border-radius:11px;background:rgba(20,21,27,.78);backdrop-filter:blur(13px);color:#f6f6f7;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:650}.stage-tool:hover{background:rgba(34,35,43,.92)}.stage-tool:disabled,.chip:disabled{opacity:.45;cursor:not-allowed;transform:none}
.controls{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.left-controls,.right-controls{display:flex;align-items:center;gap:8px}.nav-btn{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);color:#393940;font-size:18px}.nav-btn:disabled{opacity:.35;cursor:not-allowed}.slide-count{min-width:78px;text-align:center;color:var(--muted);font-size:13px;font-weight:650}.timer{font-variant-numeric:tabular-nums;font-size:14px;color:#66666e;font-weight:690;min-width:58px;text-align:center}.notes-toggle{height:42px;padding:0 14px;border-radius:13px;background:#fff;border:1px solid var(--line);font-weight:650;color:#46464d}.record{height:48px;padding:0 20px;border-radius:15px;background:#17171a;color:#fff;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 11px 28px rgba(23,23,26,.17);transition:.18s ease}.record:hover{transform:translateY(-1px)}.record.recording{background:var(--danger)}.rec-dot{width:9px;height:9px;border-radius:50%;background:#ff5d5d}.record.recording .rec-dot{background:white;animation:pulse 1.15s infinite}@keyframes pulse{50%{opacity:.35}}
.status{margin-top:13px;color:var(--muted);font-size:12px;min-height:18px}.download{display:none;height:42px;padding:0 14px;border-radius:13px;background:var(--accent-soft);color:#5148db;font-weight:700}.download.visible{display:inline-flex;align-items:center;text-decoration:none}
.file-input{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);padding:11px 15px;border-radius:13px;background:#17171a;color:#fff;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.2s ease;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.topbar{padding:0 16px}.brand{font-size:16px}.device-row .chip span.label{display:none}.main{width:min(100% - 20px,1240px);padding-top:18px}.intro{margin-bottom:12px}.title{font-size:22px}.stage-shell{border-radius:20px;padding:6px}.stage{border-radius:15px}.notes{width:78%;right:11%;height:220px}.controls{align-items:flex-start;gap:10px;flex-wrap:wrap}.right-controls{margin-left:auto}.camera-float{width:30%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>QuietCue</div>
    <div class="device-row">
      <button id="cameraBtn" class="chip" title="Turn camera on or off"><span class="dot"></span><span class="label">Camera</span><span id="cameraState">Off</span></button>
      <button id="micBtn" class="chip" title="Turn microphone on or off"><span class="dot"></span><span class="label">Mic</span><span id="micState">Off</span></button>
    </div>
  </header>

  <main class="main">
    <div class="intro">
      <div><div class="eyebrow">Present naturally. Stay on track.</div><h1 id="deckTitle" class="title">Your presentation, without the juggling.</h1></div>
      <div id="deckMeta" class="deck-meta"></div>
    </div>

    <section class="stage-shell">
      <div id="stage" class="stage">
        <canvas id="slideCanvas" width="1280" height="720"></canvas>
        <div id="pptxStage" class="pptx-stage"></div>
        <div id="empty" class="empty">
          <div>
            <h2>Add your presentation</h2>
            <p>PowerPoint, PDF, JPG or PNG. Your notes stay private and never appear in the recording.</p>
          </div>
          <button id="uploadBtn" class="primary">Upload presentation</button>
        </div>

        <div id="cameraFloat" class="camera-float">
          <video id="cameraVideo" autoplay muted playsinline></video>
          <div id="cameraResize" class="resize-handle"></div>
        </div>

        <div id="notes" class="notes">
          <div id="notesHead" class="notes-head"><span>Private notes</span><button id="closeNotes" class="ghost" aria-label="Close notes">✕</button></div>
          <textarea id="notesText" placeholder="Type or paste your notes here…"></textarea>
          <div id="notesResize" class="resize-handle"></div>
        </div>

        <div id="stageTools" class="stage-tools">
          <button id="replaceBtn" class="stage-tool">Replace deck</button>
          <button id="resetCameraBtn" class="stage-tool">Reset camera</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <div class="left-controls">
        <button id="prevBtn" class="nav-btn" disabled>‹</button>
        <div id="slideCount" class="slide-count">—</div>
        <button id="nextBtn" class="nav-btn" disabled>›</button>
        <button id="notesBtn" class="notes-toggle">Notes</button>
      </div>
      <div class="right-controls">
        <div id="timer" class="timer">00:00</div>
        <a id="downloadBtn" class="download" download="quietcue-recording.webm">Download</a>
        <button id="recordBtn" class="record" disabled><span class="rec-dot"></span><span id="recordLabel">Record</span></button>
      </div>
    </div>
    <div id="status" class="status">Upload a presentation to begin.</div>
    <input id="fileInput" class="file-input" type="file" accept=".pptx,.pdf,.png,.jpg,.jpeg,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/png,image/jpeg" multiple />
    <canvas id="recordCanvas" width="1280" height="720" hidden></canvas>
  </main>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs';
import { PptxViewer, RECOMMENDED_ZIP_LIMITS } from 'https://cdn.jsdelivr.net/npm/@aiden0z/pptx-renderer@1.2.4/dist/aiden0z-pptx-renderer.browser.es.js';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.min.mjs';

const $=id=>document.getElementById(id);
const E={
  stage:$('stage'),slideCanvas:$('slideCanvas'),pptxStage:$('pptxStage'),empty:$('empty'),uploadBtn:$('uploadBtn'),replaceBtn:$('replaceBtn'),fileInput:$('fileInput'),
  deckTitle:$('deckTitle'),deckMeta:$('deckMeta'),prevBtn:$('prevBtn'),nextBtn:$('nextBtn'),slideCount:$('slideCount'),stageTools:$('stageTools'),
  cameraBtn:$('cameraBtn'),micBtn:$('micBtn'),cameraState:$('cameraState'),micState:$('micState'),cameraFloat:$('cameraFloat'),cameraVideo:$('cameraVideo'),cameraResize:$('cameraResize'),resetCameraBtn:$('resetCameraBtn'),
  notes:$('notes'),notesHead:$('notesHead'),notesText:$('notesText'),notesResize:$('notesResize'),notesBtn:$('notesBtn'),closeNotes:$('closeNotes'),
  recordBtn:$('recordBtn'),recordLabel:$('recordLabel'),recordCanvas:$('recordCanvas'),timer:$('timer'),downloadBtn:$('downloadBtn'),status:$('status'),toast:$('toast')
};

let presentationType=null,pdfDoc=null,pptxViewer=null,imageSlides=[],currentSlide=1,totalSlides=0,renderToken=0,pptxBuffer=null;
let cameraStream=null,micStream=null,recorder=null,recordChunks=[],recordingStream=null,recordStart=0,timerId=null,recordLoop=0,recordUrl=null;
const slideCtx=E.slideCanvas.getContext('2d'),recordCtx=E.recordCanvas.getContext('2d');

function toast(msg){E.toast.textContent=msg;E.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.classList.remove('show'),2200)}
function setStatus(msg){E.status.textContent=msg}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function resetCanvas(){slideCtx.fillStyle='#000';slideCtx.fillRect(0,0,E.slideCanvas.width,E.slideCanvas.height)}
function drawContained(ctx,img,x,y,w,h,bg='#000'){
  ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);const iw=img.videoWidth||img.naturalWidth||img.width,ih=img.videoHeight||img.naturalHeight||img.height;if(!iw||!ih)return;
  const s=Math.min(w/iw,h/ih),dw=iw*s,dh=ih*s;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function updateUI(){
  const loaded=totalSlides>0;E.empty.style.display=loaded?'none':'grid';E.stageTools.classList.toggle('visible',loaded);E.prevBtn.disabled=!loaded||currentSlide<=1;E.nextBtn.disabled=!loaded||currentSlide>=totalSlides;E.recordBtn.disabled=!loaded;
  E.slideCount.textContent=loaded?`${currentSlide} / ${totalSlides}`:'—';E.deckMeta.style.display=loaded?'block':'none';if(loaded)E.deckMeta.textContent=`${totalSlides} slide${totalSlides===1?'':'s'}`;
}
async function destroyPresentation(){if(pptxViewer){try{pptxViewer.destroy()}catch{}}pptxViewer=null;pdfDoc=null;imageSlides=[];pptxBuffer=null;presentationType=null;totalSlides=0;currentSlide=1;E.pptxStage.innerHTML='';E.pptxStage.classList.remove('active');E.slideCanvas.style.visibility='visible';resetCanvas();updateUI()}

async function loadPresentation(files){
  if(!files?.length)return;await destroyPresentation();const file=files[0],name=file.name.toLowerCase();E.deckTitle.textContent=file.name.replace(/\.[^.]+$/,'');setStatus('Loading presentation…');
  try{
    if(name.endsWith('.pptx')){
      const buffer=await file.arrayBuffer();pptxBuffer=buffer;const viewer=await PptxViewer.open(buffer,E.pptxStage,{renderMode:'slide',zipLimits:RECOMMENDED_ZIP_LIMITS,lazySlides:true,lazyMedia:true,pdfjs:false});pptxViewer=viewer;presentationType='pptx';totalSlides=viewer.slideCount;E.pptxStage.classList.add('active');E.slideCanvas.style.visibility='hidden';
    }else if(name.endsWith('.pdf')){
      const data=new Uint8Array(await file.arrayBuffer());pdfDoc=await pdfjsLib.getDocument({data}).promise;presentationType='pdf';totalSlides=pdfDoc.numPages;E.slideCanvas.style.visibility='visible';
    }else{
      const imageFiles=[...files].filter(f=>/image\/(png|jpeg)/.test(f.type)||/\.(png|jpe?g)$/i.test(f.name));if(!imageFiles.length)throw new Error('Unsupported file');
      imageSlides=await Promise.all(imageFiles.map(f=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(f)})));presentationType='image';totalSlides=imageSlides.length;E.slideCanvas.style.visibility='visible';
    }
    currentSlide=1;await renderSlide();updateUI();setStatus('Ready. Add notes if you want, then record.');
  }catch(err){console.error(err);await destroyPresentation();E.deckTitle.textContent='Your presentation, without the juggling.';setStatus('Could not open that presentation. Try a PDF, PPTX, JPG or PNG.');toast('Presentation could not be opened')}
}

async function rasterizePptx(){await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const snap=await window.html2canvas(E.pptxStage,{backgroundColor:'#000',useCORS:true,logging:false,scale:1});drawContained(slideCtx,snap,0,0,E.slideCanvas.width,E.slideCanvas.height,'#000')}
async function renderSlide(){
  if(!totalSlides)return;const token=++renderToken;resetCanvas();
  if(presentationType==='pdf'){
    E.pptxStage.classList.remove('active');E.slideCanvas.style.visibility='visible';const page=await pdfDoc.getPage(currentSlide),base=page.getViewport({scale:1}),scale=Math.min(E.slideCanvas.width/base.width,E.slideCanvas.height/base.height),vp=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(token!==renderToken)return;drawContained(slideCtx,c,0,0,E.slideCanvas.width,E.slideCanvas.height,'#000');
  }else if(presentationType==='image'){
    E.pptxStage.classList.remove('active');E.slideCanvas.style.visibility='visible';drawContained(slideCtx,imageSlides[currentSlide-1],0,0,E.slideCanvas.width,E.slideCanvas.height,'#000');
  }else if(presentationType==='pptx'){
    E.pptxStage.classList.add('active');E.slideCanvas.style.visibility='hidden';await pptxViewer.goToSlide(currentSlide-1,{behavior:'instant'});if(token!==renderToken)return;await rasterizePptx();
  }
  updateUI();
}
async function go(delta){if(!totalSlides)return;const n=Math.max(1,Math.min(totalSlides,currentSlide+delta));if(n===currentSlide)return;currentSlide=n;await renderSlide()}

async function toggleCamera(){
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;E.cameraVideo.srcObject=null;E.cameraFloat.classList.remove('visible');E.cameraBtn.classList.remove('on');E.cameraState.textContent='Off';return}
  try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});E.cameraVideo.srcObject=cameraStream;await E.cameraVideo.play();E.cameraFloat.classList.add('visible');E.cameraBtn.classList.add('on');E.cameraState.textContent='On';toast('Camera connected')}catch(err){console.error(err);toast('Camera permission was not granted')}
}
async function toggleMic(){
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;E.micBtn.classList.remove('on');E.micState.textContent='Off';return}
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});E.micBtn.classList.add('on');E.micState.textContent='On';toast('Microphone connected')}catch(err){console.error(err);toast('Microphone permission was not granted')}
}

function makeFloating(panel,handle,resizeHandle,{aspect=null,minW=160,minH=100}={}){
  let action=null,startX=0,startY=0,startL=0,startT=0,startW=0,startH=0;
  const begin=(e,type)=>{e.preventDefault();const stage=E.stage.getBoundingClientRect(),r=panel.getBoundingClientRect();action=type;startX=e.clientX;startY=e.clientY;startL=r.left-stage.left;startT=r.top-stage.top;startW=r.width;startH=r.height;document.body.style.userSelect='none';};
  handle.addEventListener('pointerdown',e=>begin(e,'move'));resizeHandle.addEventListener('pointerdown',e=>{e.stopPropagation();begin(e,'resize')});
  window.addEventListener('pointermove',e=>{if(!action)return;const s=E.stage.getBoundingClientRect(),dx=e.clientX-startX,dy=e.clientY-startY;if(action==='move'){const l=Math.min(Math.max(0,startL+dx),s.width-panel.offsetWidth),t=Math.min(Math.max(0,startT+dy),s.height-panel.offsetHeight);panel.style.left=`${l/s.width*100}%`;panel.style.top=`${t/s.height*100}%`;panel.style.right='auto'}else{let w=Math.max(minW,startW+dx),h=aspect?w/aspect:Math.max(minH,startH+dy);w=Math.min(w,s.width-startL);h=Math.min(h,s.height-startT);if(aspect){w=Math.min(w,h*aspect);h=w/aspect}panel.style.width=`${w/s.width*100}%`;panel.style.height=`${h/s.height*100}%`}});
  window.addEventListener('pointerup',()=>{action=null;document.body.style.userSelect=''})
}
makeFloating(E.cameraFloat,E.cameraFloat,E.cameraResize,{aspect:16/10,minW:150,minH:94});makeFloating(E.notes,E.notesHead,E.notesResize,{minW:220,minH:140});
function resetCamera(){E.cameraFloat.style.left='72%';E.cameraFloat.style.top='67%';E.cameraFloat.style.width='22%';E.cameraFloat.style.height='auto';}

function composeFrame(){
  recordCtx.fillStyle='#000';recordCtx.fillRect(0,0,1280,720);recordCtx.drawImage(E.slideCanvas,0,0,1280,720);
  if(cameraStream&&E.cameraFloat.classList.contains('visible')&&E.cameraVideo.readyState>=2){const s=E.stage.getBoundingClientRect(),r=E.cameraFloat.getBoundingClientRect(),x=(r.left-s.left)/s.width*1280,y=(r.top-s.top)/s.height*720,w=r.width/s.width*1280,h=r.height/s.height*720;recordCtx.save();roundRect(recordCtx,x,y,w,h,24);recordCtx.clip();recordCtx.translate(x+w,y);recordCtx.scale(-1,1);recordCtx.drawImage(E.cameraVideo,0,0,w,h);recordCtx.restore()}
}
function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function frameLoop(){composeFrame();recordLoop=requestAnimationFrame(frameLoop)}
function pickMime(){return ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||''}
async function startRecording(){
  if(recorder?.state==='recording'){stopRecording();return}if(!totalSlides)return;
  if(!micStream){try{await toggleMic()}catch{}}
  if(typeof MediaRecorder==='undefined'){toast('Recording is not supported in this browser');return}
  recordChunks=[];if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl=null}E.downloadBtn.classList.remove('visible');composeFrame();const canvasStream=E.recordCanvas.captureStream(30);const tracks=[...canvasStream.getVideoTracks()];if(micStream)tracks.push(...micStream.getAudioTracks());recordingStream=new MediaStream(tracks);const mime=pickMime();recorder=new MediaRecorder(recordingStream,mime?{mimeType:mime,videoBitsPerSecond:5500000,audioBitsPerSecond:128000}:{videoBitsPerSecond:5500000});recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=finishRecording;recorder.start(1000);recordStart=Date.now();E.recordBtn.classList.add('recording');E.recordLabel.textContent='Stop';E.cameraBtn.disabled=true;E.micBtn.disabled=true;E.replaceBtn.disabled=true;setStatus('Recording. Your private notes are not included.');timerId=setInterval(()=>E.timer.textContent=fmt((Date.now()-recordStart)/1000),250);frameLoop();
}
function stopRecording(){if(recorder&&recorder.state!=='inactive')recorder.stop()}
function finishRecording(){cancelAnimationFrame(recordLoop);clearInterval(timerId);recordingStream?.getTracks().forEach(t=>{if(!cameraStream?.getTracks().includes(t)&&!micStream?.getTracks().includes(t))t.stop()});const blob=new Blob(recordChunks,{type:recorder?.mimeType||'video/webm'});if(blob.size){recordUrl=URL.createObjectURL(blob);E.downloadBtn.href=recordUrl;E.downloadBtn.classList.add('visible');setStatus('Recording ready to download.')}else setStatus('Recording could not be saved.');E.recordBtn.classList.remove('recording');E.recordLabel.textContent='Record';E.cameraBtn.disabled=false;E.micBtn.disabled=false;E.replaceBtn.disabled=false;recorder=null}

E.uploadBtn.addEventListener('click',()=>E.fileInput.click());E.replaceBtn.addEventListener('click',()=>E.fileInput.click());E.fileInput.addEventListener('change',()=>loadPresentation(E.fileInput.files));
E.prevBtn.addEventListener('click',()=>go(-1));E.nextBtn.addEventListener('click',()=>go(1));E.cameraBtn.addEventListener('click',toggleCamera);E.micBtn.addEventListener('click',toggleMic);E.resetCameraBtn.addEventListener('click',resetCamera);
E.notesBtn.addEventListener('click',()=>E.notes.classList.toggle('visible'));E.closeNotes.addEventListener('click',e=>{e.stopPropagation();E.notes.classList.remove('visible')});E.recordBtn.addEventListener('click',startRecording);
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);if((e.key==='n'||e.key==='N'))E.notes.classList.toggle('visible')});
window.addEventListener('beforeunload',()=>{cameraStream?.getTracks().forEach(t=>t.stop());micStream?.getTracks().forEach(t=>t.stop());if(recordUrl)URL.revokeObjectURL(recordUrl)});
resetCanvas();updateUI();
</script>
